<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RSARSY Presence</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 24px; min-height: 100vh; display: grid; place-items: center; background: #f7f5fc; color: #252239; font: 16px/1.6 system-ui, sans-serif; }
        main { max-width: 400px; padding: 32px; background: white; border: 1px solid #e8e3f3; border-radius: 24px; }
        .app-logo { display: block; width: 112px; height: 112px; margin: 0 auto 24px; object-fit: contain; }
        h1 { font-size: 24px; line-height: 1.3; }
        p { color: #676179; }
        a { display: inline-block; padding: 12px 24px; background: #7557d5; border-radius: 12px; color: white; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <main>
        <img class="app-logo" src="images/arsy-presensi-logo.png" alt="ARSY Presensi" width="500" height="500">
        <h1>Aplikasi belum bisa dibuka</h1>
        <p>Periksa koneksi ke server presensi, lalu coba lagi.</p>
        <a href="rsarsy-retry://home">Coba lagi</a>
    </main>
</body>
</html>
